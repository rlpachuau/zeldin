<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Reality Not Found | Zeldin Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }
        .error-code {
            font-family: 'Teko', sans-serif;
            font-size: 150px;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0;
            text-shadow: 0 0 30px rgba(230, 75, 31, 0.5);
        }
        .error-msg {
            font-family: 'Teko', sans-serif;
            font-size: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="hero" style="position: absolute; inset: 0; z-index: -1; opacity: 0.3;"></div>
        
        <h1 class="error-code">404</h1>
        <p class="error-msg">Imagination Lost. Page Not Found.</p>
        
        <a href="index.html" class="btn">Return to Base</a>
    </div>

</body>
</html>
